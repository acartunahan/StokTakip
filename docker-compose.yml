services:
  oracle-target:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle-target
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: Oracle_12345
      APP_USER: stoktakip
      APP_USER_PASSWORD: stoktakip
    volumes:
      - oracle_target_data:/opt/oracle/oradata

  oracle-legacy:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle-legacy
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: Oracle_12345
      APP_USER: legacy_readonly
      APP_USER_PASSWORD: legacy_readonly
    volumes:
      - oracle_legacy_data:/opt/oracle/oradata

volumes:
  oracle_target_data:
  oracle_legacy_data: