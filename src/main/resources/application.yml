spring:
  application:
    name: stok-takip
  datasource:
    url: ${TARGET_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${TARGET_DB_USERNAME:stoktakip}
    password: ${TARGET_DB_PASSWORD:stoktakip}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

app:
  migration:
    enabled: false
    dry-run: true
    chunk-size: 500
    legacy-datasource:
      url: ${LEGACY_DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
      username: ${LEGACY_DB_USERNAME:legacy_readonly}
      password: ${LEGACY_DB_PASSWORD:legacy_readonly}
      driver-class-name: oracle.jdbc.OracleDriver